<div class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
  <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
    <div>
      <p class="text-sm font-semibold uppercase tracking-wide text-blue-900">Availability</p>
      <h3 class="text-2xl font-semibold text-slate-900">{{ viewDate | date:'MMMM yyyy' }}</h3>
    </div>
    <div class="flex items-center gap-2">
      <button type="button" (click)="prevMonth()" class="rounded-full border border-slate-300 p-2 text-slate-600 transition hover:border-yellow-400 hover:text-yellow-500">
        ‹
      </button>
      <button type="button" (click)="nextMonth()" class="rounded-full border border-slate-300 p-2 text-slate-600 transition hover:border-yellow-400 hover:text-yellow-500">
        ›
      </button>
    </div>
  </div>

  <div class="mt-6 grid grid-cols-7 gap-2 text-center text-xs font-semibold uppercase tracking-wide text-slate-500">
    <span>Sun</span>
    <span>Mon</span>
    <span>Tue</span>
    <span>Wed</span>
    <span>Thu</span>
    <span>Fri</span>
    <span>Sat</span>
  </div>

  <div class="mt-2 flex flex-col gap-2">
    <div *ngFor="let week of weeks" class="grid grid-cols-7 gap-2">
      <div *ngFor="let cell of week" class="flex min-h-[110px] flex-col rounded-xl border p-3 text-left transition" [ngClass]="{
        'border-yellow-400 bg-yellow-50': cell.isToday,
        'border-slate-200 bg-white': cell.inCurrentMonth && !cell.isToday,
        'border-slate-100 bg-slate-50 text-slate-400': !cell.inCurrentMonth
      }">
        <span class="text-sm font-semibold" [ngClass]="{'text-yellow-600': cell.isToday}">
          {{ cell.date | date:'d' }}
        </span>
        <div class="mt-2 flex flex-col gap-1">
          <div *ngFor="let booking of cell.bookings | slice:0:2" class="rounded-lg bg-blue-900/10 px-2 py-1 text-xs text-blue-900">
            <span class="font-semibold">{{ booking.status || 'reserved' }}</span>
            <span *ngIf="booking.spaceReserved"> · {{ booking.spaceReserved }} m²</span>
          </div>
          <div *ngIf="cell.bookings.length > 2" class="text-xs text-slate-500">
            +{{ cell.bookings.length - 2 }} more
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

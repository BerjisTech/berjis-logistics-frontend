<div class="fixed w-full h-full top-0 left-0 bottom-0 right-0 flex items-start justify-start overflow-hidden" style="font-family: Inter, Arial, sans-serif;">
  <!-- Left Sidebar: Navigation -->
  <div class="w-[250px] h-full overflow-hidden flex flex-col border-r border-slate-200 dark:border-slate-800" style="padding:12px; gap:6px;">
    <h3 style="margin:8px 0;">Dashboard</h3>
    <a routerLink="/dashboard" style="text-decoration:none; color:inherit; padding:8px; border-radius:8px; display:block;">Overview</a>
    <a routerLink="/dashboard/storage" style="text-decoration:none; color:inherit; padding:8px; border-radius:8px; display:block;">Storage</a>
    <a routerLink="/dashboard/fleet" style="text-decoration:none; color:inherit; padding:8px; border-radius:8px; display:block;">Fleet</a>
    <a routerLink="/dashboard/products" style="text-decoration:none; color:inherit; padding:8px; border-radius:8px; display:block;">Products</a>
    <a routerLink="/finance" style="text-decoration:none; color:inherit; padding:8px; border-radius:8px; display:block;">Finance</a>
    <a routerLink="/marketing" style="text-decoration:none; color:inherit; padding:8px; border-radius:8px; display:block;">Marketing</a>
    <a routerLink="/shipments" style="text-decoration:none; color:inherit; padding:8px; border-radius:8px; display:block;">Shipments</a>
    <a routerLink="/dashboard/crm" style="text-decoration:none; color:inherit; padding:8px; border-radius:8px; display:block;">CRM</a>
    <a routerLink="/dashboard/driver" style="text-decoration:none; color:inherit; padding:8px; border-radius:8px; display:block;">Driver</a>
  </div>

  <!-- Main Area -->
  <div class="flex-grow overflow-hidden">
    <!-- Header with global search -->
    <div class="h-[70px] shadow w-full" style="display:flex; align-items:center; padding:0 16px; gap:12px; position:relative;">
      <input (input)="onSearchInput($event)" [value]="q()" placeholder="Search warehouses, vehicles, contacts" style="flex:1; max-width:720px; padding:10px; border:1px solid #ddd; border-radius:10px;" />
      <div *ngIf="results().length" style="position:absolute; top:56px; left:16px; right:16px; background:#fff; border:1px solid #eee; border-radius:10px; padding:8px; max-width:820px;">
        <div *ngFor="let r of results()" (click)="clearSearch()" style="padding:6px 8px; cursor:pointer; border-radius:6px;">
          <a [routerLink]="r.route" style="text-decoration:none; color:inherit;">{{r.label}}</a>
        </div>
      </div>
    </div>
    <!-- Content -->
    <div class="h-[calc(100vh-70px)] w-full overflow-x-hidden overflow-y-auto">
      <div class="p-4">
        <router-outlet></router-outlet>
      </div>
    </div>
  </div>

  <!-- Right Sidebar: Useful tools/links -->
  <div class="w-[250px] h-full overflow-hidden flex flex-col border-l border-slate-200 dark:border-slate-800" style="padding:12px; gap:8px;">
    <h3 style="margin:8px 0;">Tools</h3>
    <a routerLink="/storage" style="text-decoration:none; color:inherit; padding:8px; border-radius:8px; display:block; border:1px solid #eee;">Find Storage</a>
    <a routerLink="/products" style="text-decoration:none; color:inherit; padding:8px; border-radius:8px; display:block; border:1px solid #eee;">Browse Products</a>
    <a routerLink="/transport" style="text-decoration:none; color:inherit; padding:8px; border-radius:8px; display:block; border:1px solid #eee;">Browse Transport</a>
    <a routerLink="/tracking-demo" style="text-decoration:none; color:inherit; padding:8px; border-radius:8px; display:block; border:1px solid #eee;">Tracking Demo</a>
    <div style="margin-top:12px; padding:8px; border:1px solid #eee; border-radius:8px;">
      <div style="display:flex; align-items:center; gap:8px;">
        <span style="display:inline-block; width:10px; height:10px; border-radius:50%; background:#0a4;"></span>
        <span>Service Health: see Dev Toolbar</span>
      </div>
    </div>
  </div>
</div>

<div class="min-h-screen bg-slate-50/70 px-4 py-6 md:px-6">
  <div class="mx-auto max-w-6xl">
    <div class="mb-4 flex items-center justify-between">
      <div>
        <h2 class="text-xl font-semibold text-slate-900">Storage</h2>
        <p class="text-sm text-slate-600">Manage your warehouses and units.</p>
      </div>
      <a routerLink="/dashboard/storage/manage" class="inline-flex items-center rounded-xl bg-blue-900 px-3 py-1.5 text-sm font-semibold text-white shadow shadow-blue-900/30 transition hover:-translate-y-0.5 hover:bg-blue-800">Create / Manage</a>
    </div>

    <div *ngIf="loading" class="text-slate-600">Loading…</div>
    <div *ngIf="!loading && !warehouses.length" class="rounded-2xl border border-dashed border-slate-300 bg-white/70 p-6 text-center text-slate-600">No storage locations yet. Click “Create / Manage”.</div>

    <div *ngIf="!loading && warehouses.length" class="grid grid-cols-1 gap-4 md:grid-cols-2">
      <div *ngFor="let w of warehouses" class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm shadow-slate-900/5">
        <div class="flex items-center justify-between">
          <div>
            <div class="text-sm font-semibold text-slate-900">{{ w.name }}</div>
            <div class="text-xs text-slate-600"><span *ngIf="w.location">{{ w.location }}</span> <span *ngIf="w.state">· {{ w.state }}</span></div>
          </div>
          <a [routerLink]="['/dashboard/storage/manage']" [queryParams]="{ id: w.id }" class="text-xs font-semibold text-blue-900 hover:text-blue-800">Edit</a>
        </div>
        <div class="mt-2 text-xs text-slate-500" *ngIf="w.areaSqm">Area · {{ w.areaSqm }} m²</div>
        <div class="mt-1 text-xs" [ngClass]="w.isMultiUnit ? 'text-blue-900' : 'text-slate-500'">{{ w.isMultiUnit ? 'Multi‑unit' : 'Single unit' }}</div>
      </div>
    </div>
  </div>
</div>

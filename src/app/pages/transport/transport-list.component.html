<div class="min-h-screen bg-slate-50/70 px-4 py-6 md:px-6">
  <div class="mx-auto max-w-6xl">
    <div class="mb-4 flex items-center justify-between">
      <div>
        <h2 class="text-xl font-semibold text-slate-900">Transport</h2>
        <p class="text-sm text-slate-600">Discover available transport options. Booking requires an account; managing requires ownership.</p>
      </div>
    </div>
    <form (submit)="$event.preventDefault(); search();" class="mb-4 flex flex-wrap items-center gap-2">
      <input [(ngModel)]="q" name="q" placeholder="Filter by kind (e.g., truck, van)" class="min-w-[240px] flex-1 rounded-xl border border-slate-200 px-3 py-2 text-sm text-slate-800 focus:border-blue-900 focus:outline-none focus:ring-2 focus:ring-blue-900/30" />
      <input type="number" [(ngModel)]="minCapacity" name="minCapacity" placeholder="Min capacity (kg)" class="w-[200px] rounded-xl border border-slate-200 px-3 py-2 text-sm text-slate-800 focus:border-blue-900 focus:outline-none focus:ring-2 focus:ring-blue-900/30" />
      <input [(ngModel)]="near" name="near" placeholder="lat,lng" class="w-[200px] rounded-xl border border-slate-200 px-3 py-2 text-sm text-slate-800 focus:border-blue-900 focus:outline-none focus:ring-2 focus:ring-blue-900/30" />
      <input type="number" [(ngModel)]="radiusKm" name="radius" placeholder="km" class="w-[100px] rounded-xl border border-slate-200 px-3 py-2 text-sm text-slate-800 focus:border-blue-900 focus:outline-none focus:ring-2 focus:ring-blue-900/30" />
      <button type="button" (click)="geolocate()" class="rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm font-medium text-blue-900 shadow-sm transition hover:bg-blue-50">Near me</button>
      <button type="submit" class="rounded-xl bg-blue-900 px-4 py-2 text-sm font-semibold text-white shadow shadow-blue-900/30 transition hover:-translate-y-0.5 hover:bg-blue-800">Search</button>
    </form>

    <div *ngIf="loading" class="text-slate-600">Loading…</div>

    <div *ngIf="!loading" class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3">
      <div *ngFor="let v of items" class="rounded-2xl border border-slate-200 bg-white/90 p-3 shadow-sm shadow-slate-900/5 backdrop-blur">
        <app-image-carousel *ngIf="v.images?.length" [images]="v.images" class="mb-2"></app-image-carousel>
        <div class="flex items-center justify-between">
          <div class="text-sm font-semibold text-slate-900">{{ v.kind || 'Vehicle' }}</div>
          <div class="text-xs font-semibold uppercase tracking-wide text-blue-900" *ngIf="v.capacityKg">{{ v.capacityKg | number:'1.0-0' }} kg</div>
        </div>
        <div class="mt-1 text-xs text-slate-600" *ngIf="v.distanceKm">~ {{ v.distanceKm | number:'1.0-1' }} km away</div>
        <div class="mt-2 flex items-center gap-2">
          <span class="inline-flex items-center rounded-full border border-yellow-400/60 bg-yellow-100 px-2 py-0.5 text-[11px] font-semibold text-yellow-700">Available</span>
        </div>
      </div>
    </div>
  </div>
</div>
